# SurgicalSlicing – base config for the optic-disc (nerve) glaucoma classifier.
# Profiles `laptop.yaml` / `gpu.yaml` extend this file and override only hardware-related values.
# Any value can also be overridden from the command line:  --set training.lr=5e-5 --set folds.k=6
#
# Relative paths are resolved against the repository root (the folder that contains code_new/).

run:
  name: surgical_v1                      # output folder: <output_root>/<name>
  output_root: training-runs             # gets its own .gitignore ("*"), nothing from here is committed
  seed: 1234

device:
  use_cuda_if_available: true
  amp: auto                              # auto = float16 autocast on CUDA, off on CPU
  cpu_threads: 0                         # 0 = all cores

# ── Data ───────────────────────────────────────────────────────────────────────────────
# Each dataset = a folder with images/ and labels/ (labels/<image file name>.csv,
# header glaucoma,atrophy,valid_image – the same format the old scripts write).
# The trainer works on ONE dataset at a time and moves to the next one after
# `folds.passes_per_dataset` full passes (the list is cycled).
datasets:
  - name: odir_local_v1
    path: training-data/classifier/datasets/odir_local_v1
    # images: images        # optional sub-folder names, defaults shown
    # labels: labels
  # - name: legacy_v0          # older crops (built by tools/organize_training_data.py)
  #   path: training-data/classifier/datasets/legacy_v0
  # - name: odir5k_full        # your next dataset: same layout, images/ + labels/
  #   path: training-data/classifier/datasets/odir5k_full

labels:
  order: [glaucoma, atrophy, valid_image]
  positive_threshold: 0.5               # target >= this counts as positive (0.5 = "suspected")
  # Patient grouping for folds: images of one patient (both eyes, every crop) never end up in
  # different folds. Default rule handles ODIR (`1138_left_0.jpg` -> 1138) and the local
  # clinic names (`028ІГБ02_1_0.jpg` -> 028ІГБ). Set a regex with one group to override.
  group_regex: null

preprocess:
  size: 128                             # network input is size x size
  mode: stretch                         # stretch | pad (letterbox, keeps aspect) | center_crop
  crop_fraction: 1.0                    # center_crop only: keep this fraction of the shorter side
  cache_images: true                    # keep decoded, resized images in RAM

augmentation:
  hflip: 0.5
  vflip: 0.5
  rotation_degrees: 10
  color_jitter: [0.15, 0.15, 0.10, 0.05] # brightness, contrast, saturation, hue
  randaug_magnitude: 9                  # 0 = off

# ── Folds ─────────────────────────────────────────────────────────────────────────────
# One fold step = train on fold order[j], then test on the NEXT fold order[j+1]
# (the one the network has not been trained on in this pass yet).
# A pass = every fold trained once. After each pass the fold order is shuffled.
# Dropout / penalty schedules and the accuracy gate work per pass (the "epoch" of this method).
folds:
  k: 5
  repeats_per_step: 1                   # sweeps over the training fold in one step
  passes_per_dataset: 3                 # switch to the next dataset after this many passes
  test_fraction: 0.10                   # patients held out completely (never trained on); 0 = off

# ── Model ─────────────────────────────────────────────────────────────────────────────
model:
  init: vgg16                           # vgg16 | checkpoint | scratch
  checkpoint: null                      # for init: checkpoint (old *.pth from the 16_01_2026 trainer also works)
  base: 64                              # starting width (VGG16 layout: 64,64,128,128,256x3,512x3,512)
  hidden: 64                            # fully connected hidden units

training:
  batch_size: 16
  num_workers: 2
  lr: 1.0e-4
  lr_cycle_decay: 0.8                   # lr *= this after every cut
  lr_min: 1.0e-6
  weight_decay: 0.0
  betas: [0.9, 0.999]
  pos_weight: [2.0, 2.0, 1.0]           # BCE weight of positives per label (pushes recall up)
  grad_clip: 5.0                        # 0 = off

# ── Quality gate ──────────────────────────────────────────────────────────────────────
# Checked on the pooled "next fold" predictions of one pass.
gate:
  source: folds                         # folds | test  (test = the held-out patients)
  accuracy: 0.90                        # mean per-label accuracy over accuracy_labels
  recall: 0.95                          # recall must be > this, min over recall_labels
  accuracy_labels: [glaucoma, atrophy, valid_image]
  recall_labels: [glaucoma, atrophy]
  decision_threshold: 0.5
  degrade_tolerance: 0.02               # during the ramp: below gate - tolerance => hold the ramp

# ── SurgicalSlicing schedule ──────────────────────────────────────────────────────────
surgical:
  # learn phase
  learn_dropout: 0.0
  min_learn_passes: 3
  gate_consecutive_passes: 2            # gate must hold this many passes in a row (one lucky pass is not enough)
  max_learn_passes: 200                 # first cycle; raise it if the gate is reached late
  max_recover_passes: 120               # after a cut
  # dropout ramp, applied to the layers listed in dropout_layers
  dropout_step: 0.02                    # per pass
  dropout_max: 0.5
  dropout_layers: [encoder1.4, encoder2.4, encoder3.6, encoder4.6, intermediate.2, fc.2]
  max_hold_passes: 10                   # ramp may pause this many passes per cycle if metrics drop
  # penalty on the channels that will be cut
  penalty_start_dropout: 0.2            # select channels + start penalising when dropout reaches this
  penalty_base: 0.5                     # "standard" penalty
  penalty_step: 0.066                   # +6.6 % of penalty_base per pass  (0.033 / pass, 15 passes to 0.5)
  penalty_mode: shrink                  # shrink: once per pass  w_sel *= (1 - lambda)
                                        # l2:     loss += lambda * l2_scale * mean(w_sel^2) every step
  l2_scale: 1.0
  hold_passes_at_max: 0                 # extra passes at dropout_max / full penalty before cutting
  # what is cut
  cut_ratio: 0.125                      # fraction of channels per layer cut in one cycle
  cut_fc_hidden: true
  importance: l1                        # l1 (filter weights) | l1_inout (filter * next-layer usage)
  min_channels: 8
  # stop / retry
  max_cycles: 8
  target_param_ratio: 0.15              # stop when params <= this fraction of the start model
  retry_ratio_factor: 0.5               # recovery failed -> back to the last accepted model, cut less
  max_retries: 2
  min_cut_ratio: 0.03

logging:
  print_every_steps: 1
  save_state_every_step: true           # state_last.pth after every fold step (resume point)
