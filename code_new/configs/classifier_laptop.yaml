# Classifier on a standard laptop, CPU only (Windows or Linux).
extends: classifier_base.yaml

run:
  name: classifier_laptop_v2         # v1 (flatten head, average gate) stays in training-runs/classifier_laptop

device:
  use_cuda_if_available: false

training:
  batch_size: 8
  effective_batch_size: 16
  num_workers: 0            # Windows: worker processes are slow to start and copy the image cache
