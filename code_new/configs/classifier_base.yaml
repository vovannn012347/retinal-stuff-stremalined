# Step 2: glaucoma classifier on optic-disc crops (multi-label: glaucoma, atrophy, valid_image).
extends: common.yaml
task: classifier

run:
  name: classifier_v1

# Each dataset = a folder with images/ and labels/ (labels/<image file name>.csv,
# header glaucoma,atrophy,valid_image). The list is cycled every folds.passes_per_dataset passes.
# Made by make_classifier_crops.py (definitor -> every island -> crop from the ORIGINAL photo, no CLAHE).
datasets:
  - name: odir_local_x9_v3              # crops from the x9 definitor (make_classifier_crops.py)
    path: training-data/eye-classifier/odir_local_x9_v3
    labels: labels_train                # the subset from tools/make_train_subset.py (images/ with these labels)
  # - name: legacy_v0
  #   path: training-data/classifier/datasets/legacy_v0

labels:
  order: [glaucoma, atrophy, valid_image]
  positive_threshold: 0.5               # target >= this counts as positive (0.5 = "suspected")
  group_regex: null                     # patient key override (regex with one group)
  # Label learning (soft bootstrapping): the TRAINING target of every crop moves slowly from the given
  # label towards the network's out-of-fold prediction (the 'test on the next fold' step, never a
  # prediction on an image it has just trained on). Gate and metrics always use the given labels.
  # refined_labels.csv (run folder) lists the crops whose target moved most = label files to re-check.
  learning:
    enabled: true
    labels: [glaucoma, atrophy]         # which outputs may move (valid_image: correct by hand)
    rate: 0.01                          # per out-of-fold look = per pass: after 50 passes a confident
                                        #   disagreement has moved the target ~40 % of the way
    start: after_accept                 # after_accept: only once a model passed the gate on the given
                                        #   labels (its opinion is worth something) | pass: from start_pass
    start_pass: 10
    max_shift: 0.4                      # never further than this from the given label (1.0 stays >= 0.6)
    space: prob                         # prob | logodds (binary Bayes filter form)

preprocess:
  size: 128
  mode: stretch                         # stretch | pad (letterbox) | center_crop
  crop_fraction: 1.0                    # center_crop only
  cache_images: true

augmentation:
  hflip: 0.5
  vflip: 0.5
  rotation_degrees: 10
  color_jitter: [0.15, 0.15, 0.10, 0.05] # brightness, contrast, saturation, hue
  randaug_magnitude: 9                  # 0 = off

model:
  init: vgg16                           # vgg16 | checkpoint | scratch (old 16_01_2026 *.pth also loads)
  base: 64
  hidden: 64
  head: gap                             # gap: global average pooling -> fc (512x64 weights): ~2M fewer params,
                                        #   much less room to memorise a few hundred crops
                                        # flatten: full original layout (32768x64 weights in fc.0) - the v1 run
                                        #   learned the training folds 100 % with it and stalled on held-out

training:
  batch_size: 16
  effective_batch_size: 16
  num_workers: 2
  lr: 1.0e-4                            # VGG encoder (fine-tuning)
  new_layers_lr_mult: 10                # intermediate conv + fc start from random: 1e-3
  pos_weight: [3.0, 2.0, 1.0]           # BCE weight of positives per label: a missed glaucoma costs 3x
                                        #   (v1 had specificity 0.95 to spare and recall stuck at ~0.78)

gate:
  # plateau: accept the BEST held-out snapshot once the smoothed score (harmonic mean of accuracy and
  # recall) has not improved for plateau_passes passes; the numbers below are only floors it must meet.
  # (v1 with mode average and recall 0.93 trained 148 passes without ever accepting.)
  # In the first cycle a snapshot below the floors is never accepted - keep the floors reachable.
  mode: plateau
  plateau_passes: 8
  decision_threshold: 0.5               # probability >= this counts as positive; try 0.35 if specificity
                                        #   has room and recall is short (the script package reads it)
  accuracy: 0.90                        # mean per-label accuracy over accuracy_labels
  recall: 0.80                          # floor: recall must be > this, min over recall_labels (ODIR's
                                        #   diagnosis-based glaucoma labels cap disc-crop recall ~0.8-0.9)
  specificity: 0.85                     # healthy crops must not be flagged: TN / (TN + FP) >= this,
                                        #   min over recall_labels (the cost of false alarms)
  accuracy_labels: [glaucoma, atrophy, valid_image]
  recall_labels: [glaucoma]             # add atrophy once its own crops are in (only 4 crops now)

surgical:
  cut_fc_hidden: true
