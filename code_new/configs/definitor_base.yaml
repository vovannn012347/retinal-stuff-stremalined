# Step 1: optic nerve disc definitor (segmentation: fundus image -> disc mask).
extends: common.yaml
task: definitor

run:
  name: definitor_v1

# Each dataset = an image folder + a mask folder. Masks are matched by name:
#   images/015МЛФ01.png  <->  masks/015МЛФ01.mask.png   (any image extension on both sides)
# The default is the output of prepare_definitor_inputs.py (border cropped, HSV-S equalised,
# CLAHE-LAB, 512 x 512) - run it first:   python code_new/prepare_definitor_inputs.py
datasets:
  - name: local_definitor_v1
    images: training-data/eye-nerve-definitor/prepared_512/images
    masks: training-data/eye-nerve-definitor/prepared_512/masks

group_regex: null                       # patient key override (regex with one group)

preprocess:
  size: 512                             # input is size x size, divisible by 16; = the prepared images
                                        # (disc ~120 px across at 512 - enough for the mask)
  crop_to_retina: true                  # crop the black border away first (same box for the mask)
  black_level: 10                       # grey level that still counts as border
  grayscale: true                       # the old trainer fed grey images (RandomGreyscale p=1)
                                        # colour enhancement is done beforehand by prepare_definitor_inputs.py
  cache_images: true

augmentation:                           # geometric ones applied to image and mask together
  hflip: 0.5
  vflip: 0.5
  rotation_degrees: 10
  scale: 0.10                           # +-10 %
  shift: 0.08                           # +-8 % of the size (teaches "find the disc", not "remember where it was")
  brightness_contrast: [0.15, 0.15]     # image only
  gamma: 0.25                           # gamma in [0.8, 1.25], image only
  blur_p: 0.2                           # probability of a light gaussian blur, image only

model:
  init: vgg16                           # vgg16 (encoder; base < 64 takes the strongest VGG filters) | checkpoint | scratch
  base: 64                              # full model (12.7M params); SurgicalSlicing makes it smaller.
                                        # base: 32 = half width. Old FcnskipNerveDefinitor2 checkpoints load
                                        # with init: checkpoint

training:
  batch_size: 2                         # images per forward pass (memory)
  effective_batch_size: 8               # images per optimizer step (gradient accumulation)
  num_workers: 2
  lr: 5.0e-5                            # VGG encoder
  new_layers_lr_mult: 4                 # decoder starts from random: 2e-4

folds:
  test_fraction: 0.20                   # ~7 patients held out: the gate needs more than 3-4 to mean anything
  min_steps_per_step: 20                # a fold of ~10 images is only 1-2 optimizer steps: sweep it more often,
                                        # so every dropout/penalty step gets ~100 steps to adapt

# The loss stays nearly balanced: a weak background penalty makes the prediction spread along the
# vessels into connected blobs (the old trainer weighted the background 10 vs disc 3 for that reason).
# The recall priority is enforced by the gate, measured on the CLEANED mask that the pipeline uses.
loss:
  pos_weight: 1.0                       # BCE weight of disc pixels (1 = balanced)
  tversky_weight: 1.0                   # + Tversky loss
  tversky_alpha: 0.4                    # weight of false positives
  tversky_beta: 0.6                     # weight of false negatives (slightly above alpha: mild recall bias)
  # Island-aware weights (1.0 = off). The pipeline takes every island as a candidate crop and the
  # classifier rejects wrong ones; a disc FUSED with a vessel / lesion / glare breaks it. So:
  ring_weight: 1.0                      # e.g. 5: background close around the disc weighs more (hard edge)
  ring_frac: 0.15                       #   ... fading to 1 at this fraction of the disc diameter
  bridge_weight: 1.0                    # e.g. 5: false pixels in the disc's own blob (bridges) weigh more,
  bridge_max_scale: 3.0                 #   x (1 + leaked area / disc area), at most x this; separate islands x1
  bridge_margin_frac: 0.02              # pixels within this x image size of the disc edge are edge error, not bridge

# Pixel metrics pooled over the pass:
#   recall    = correctly found disc pixels / all disc pixels       TP / (TP + FN)
#   precision = correctly found disc pixels / all predicted pixels  TP / (TP + FP)
# Pixels within boundary_tolerance_px of the true mask edge are not counted (2.9 % of disc pixels lie
# within 1 px of the edge, 5.7 % within 2 px at 576 px; the drawn edge is not more precise than that).
# strict_recall / strict_precision (every pixel) are logged too.
# Metrics are taken on the cleaned prediction (clean_prediction: opening with a disc of open_frac x
# image width, then the largest blob, holes filled) - the same post-processing crop_discs.py and the
# inference script use instead of the old magic wand. spill = share of predicted pixels thrown away
# by the cleaning (bridges, separate patches); pieces = connected blobs per image before cleaning.
gate:                                   # checked on the mean of the last 5 passes (gate.mode average)
  recall: 0.85                          # held-out patients, cleaned mask; ~0.87 is what 275 images give
  precision: 0.80
  boundary_tolerance_px: 2
  clean_prediction: true
  open_frac: 0.03
  max_spill: 0.15                       # the raw prediction may not scatter more than 15 % of its pixels
  # max_bleed: 0.10                     # optional: bleed (pixels hanging on to the disc's blob outside it
                                        #   / disc pixels) may not exceed this; logged as 'bleed' either way
