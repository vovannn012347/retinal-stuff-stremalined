# Definitor on a standard laptop, CPU only. Smaller input: full 576 px is very slow on a CPU.
extends: definitor_base.yaml

run:
  name: definitor_laptop

device:
  use_cuda_if_available: false

preprocess:
  size: 288

gate:
  boundary_tolerance_px: 1              # half resolution

training:
  batch_size: 1
  effective_batch_size: 8
  num_workers: 0
